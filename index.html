<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>UsBooth ♡</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #32172b,
          #09090d 55%
        );

      color: white;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .app {
      width: min(1000px, 100%);
      padding: 30px 18px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .heart {
      color: #ff719f;
    }

    h1 {
      font-size: clamp(42px, 8vw, 70px);
      line-height: 1;
      margin: 20px 0 15px;
      letter-spacing: -3px;
    }

    .subtitle {
      color: #aaa7b4;
      font-size: 16px;
      line-height: 1.5;
    }

    .camera-card {
      background: #15151e;
      border: 1px solid #302f3d;
      border-radius: 25px;
      padding: 15px;

      box-shadow:
        0 25px 80px #0008;
    }

    .camera-wrapper {
      position: relative;

      width: 100%;

      aspect-ratio: 4 / 3;

      background: #030305;

      border-radius: 18px;

      overflow: hidden;
    }

    #camera {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      background: #030305;
    }

    .camera-label {
      position: absolute;

      top: 12px;
      left: 12px;

      padding: 7px 11px;

      background: #000b;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 900;

      z-index: 5;
    }

    .camera-status {
      text-align: center;

      margin-top: 12px;

      color: #888592;

      font-size: 13px;
    }

    .controls {
      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-top: 18px;
    }

    button {
      border: 0;

      padding: 13px 20px;

      border-radius: 999px;

      font-weight: 900;

      cursor: pointer;

      background: #ff719f;

      color: #210812;
    }

    button.secondary {
      background: #252531;

      color: white;

      border: 1px solid #3b3a48;
    }

    button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    .info {
      margin-top: 18px;

      padding: 14px;

      border-radius: 15px;

      background: #101018;

      border: 1px solid #292835;

      color: #aaa7b4;

      font-size: 13px;

      line-height: 1.5;

      text-align: center;
    }

    .error {
      display: none;

      margin-top: 15px;

      padding: 14px;

      border-radius: 14px;

      background: #351924;

      border: 1px solid #71364d;

      color: #ffc1d0;

      font-size: 13px;

      word-break: break-word;
    }

    footer {
      text-align: center;

      margin-top: 40px;

      color: #656371;

      font-size: 11px;
    }

    @media (max-width: 600px) {

      .app {
        padding:
          20px
          10px
          40px;
      }

      .camera-card {
        padding: 10px;

        border-radius: 20px;
      }

    }

  </style>

</head>


<body>

  <main class="app">

    <header>

      <div class="logo">
        ♡ <span class="heart">US</span>BOOTH
      </div>

      <h1>
        Us, even from
        <span style="color:#ff719f">
          miles away.
        </span>
      </h1>

      <div class="subtitle">
        Two phones. One booth.
        One little memory to keep.
      </div>

    </header>


    <section class="camera-card">

      <div class="camera-wrapper">

        <video
          id="camera"
          autoplay
          muted
          playsinline
        ></video>

        <div class="camera-label">
          YOU · LIVE
        </div>

      </div>


      <div
        id="cameraStatus"
        class="camera-status"
      >
        Camera not started
      </div>


      <div class="controls">

        <button
          id="startCamera"
        >
          Start camera
        </button>


        <button
          id="flipCamera"
          class="secondary"
          disabled
        >
          🔄 Flip camera
        </button>


        <button
          id="mirrorCamera"
          class="secondary"
          disabled
        >
          🪞 Mirror
        </button>

      </div>


      <div
        id="error"
        class="error"
      ></div>


      <div class="info">

        <strong>Phase 1 + 2</strong><br>

        This version only tests the website
        and your local camera.

        <br><br>

        Metered/WebRTC will be added
        <strong>after this works.</strong>

      </div>

    </section>


    <footer>
      UsBooth · Phase 1 + 2
    </footer>

  </main>


  <script>

    /* ==================================================
       STATE
    ================================================== */

    let localStream = null;

    let facingMode = "user";

    let mirrored = false;


    /* ==================================================
       ELEMENTS
    ================================================== */

    const camera =
      document.getElementById(
        "camera"
      );

    const startButton =
      document.getElementById(
        "startCamera"
      );

    const flipButton =
      document.getElementById(
        "flipCamera"
      );

    const mirrorButton =
      document.getElementById(
        "mirrorCamera"
      );

    const cameraStatus =
      document.getElementById(
        "cameraStatus"
      );

    const errorBox =
      document.getElementById(
        "error"
      );


    /* ==================================================
       ERROR
    ================================================== */

    function showError(error) {

      console.error(
        "CAMERA ERROR:",
        error
      );

      errorBox.textContent =
        error?.message ||
        String(error);

      errorBox.style.display =
        "block";

      cameraStatus.textContent =
        "Camera failed";

      cameraStatus.style.color =
        "#ff8da9";

    }


    /* ==================================================
       START CAMERA
    ================================================== */

    async function startCamera() {

      errorBox.style.display =
        "none";


      /*
        Stop previous camera first.
      */

      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            track => track.stop()
          );

      }


      /*
        Check browser support.
      */

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        showError(
          new Error(
            "Camera API is unavailable. Make sure you are using HTTPS."
          )
        );

        return;

      }


      try {

        cameraStatus.textContent =
          "Requesting camera…";


        /*
          Ask for camera.
        */

        localStream =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                facingMode:

                  facingMode,

                width: {

                  ideal: 1280

                },

                height: {

                  ideal: 960

                }

              },

              audio: false

            });


        console.log(
          "LOCAL STREAM:",
          localStream
        );


        console.log(
          "VIDEO TRACKS:",
          localStream.getVideoTracks()
        );


        /*
          Attach camera to video.
        */

        camera.srcObject =
          localStream;


        camera.muted =
          true;

        camera.autoplay =
          true;

        camera.playsInline =
          true;


        /*
          Make sure browser actually
          starts rendering it.
        */

        await camera.play();


        /*
          Mirror state.
        */

        updateMirror();


        /*
          UI.
        */

        cameraStatus.textContent =
          "Camera working ✓";

        cameraStatus.style.color =
          "#8ff0ba";


        startButton.textContent =
          "Camera running ✓";


        flipButton.disabled =
          false;

        mirrorButton.disabled =
          false;


        /*
          Useful diagnostics.
        */

        console.log(
          "VIDEO WIDTH:",
          camera.videoWidth
        );

        console.log(
          "VIDEO HEIGHT:",
          camera.videoHeight
        );


        console.log(
          "CAMERA READY ✓"
        );

      }

      catch (error) {

        showError(
          error
        );

      }

    }


    /* ==================================================
       FLIP CAMERA
    ================================================== */

    async function flipCamera() {

      facingMode =
        facingMode === "user"
          ? "environment"
          : "user";


      await startCamera();

    }


    /* ==================================================
       MIRROR
    ================================================== */

    function updateMirror() {

      if (mirrored) {

        camera.style.transform =
          "scaleX(-1)";

        mirrorButton.textContent =
          "🪞 Mirrored";

      }

      else {

        camera.style.transform =
          "scaleX(1)";

        mirrorButton.textContent =
          "🪞 Mirror";

      }

    }


    function toggleMirror() {

      mirrored =
        !mirrored;


      updateMirror();

    }


    /* ==================================================
       BUTTONS
    ================================================== */

    startButton.addEventListener(
      "click",
      startCamera
    );


    flipButton.addEventListener(
      "click",
      flipCamera
    );


    mirrorButton.addEventListener(
      "click",
      toggleMirror
    );


    /* ==================================================
       VIDEO EVENTS
    ================================================== */

    camera.addEventListener(
      "loadedmetadata",
      () => {

        console.log(
          "VIDEO METADATA:",
          camera.videoWidth,
          "x",
          camera.videoHeight
        );

      }
    );


    camera.addEventListener(
      "playing",
      () => {

        console.log(
          "VIDEO PLAYING ✓"
        );

      }
    );


    camera.addEventListener(
      "error",
      event => {

        console.error(
          "VIDEO ELEMENT ERROR:",
          event
        );

      }
    );


    /* ==================================================
       INITIAL
    ================================================== */

    console.log(
      "UsBooth Phase 1 + 2 loaded ✓"
    );

    console.log(
      "Secure context:",
      window.isSecureContext
    );

    console.log(
      "MediaDevices:",
      navigator.mediaDevices
    );

  </script>

</body>

</html>
