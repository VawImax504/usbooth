<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UsBooth ♡ — FAQ</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui;background:radial-gradient(circle at 10% 0,#4b2037,transparent 30%),radial-gradient(circle at 90% 10%,#2a1d4b,transparent 25%),#0a070d}.wrap{width:min(850px,calc(100% - 30px));margin:auto;padding:28px 0 80px}nav{display:flex;justify-content:space-between}nav a{color:#aaa;text-decoration:none;font-size:10px}.brand{font-weight:1000;letter-spacing:3px}.brand span{color:#ff719f}.hero{padding:75px 0 35px}.eyebrow{font-size:9px;letter-spacing:3px;color:#ff9fbb;font-weight:1000}h1{font-size:clamp(45px,7vw,70px);letter-spacing:-4px;margin:10px 0}.q{border:1px solid #302430;background:#120d15;border-radius:15px;margin:8px 0;overflow:hidden}.q button{width:100%;display:flex;justify-content:space-between;text-align:left;background:none;border:0;color:#fff;padding:18px;font-weight:900;font-size:10px;cursor:pointer}.answer{display:none;padding:0 18px 18px;color:#817781;font-size:10px;line-height:1.8}.q.open .answer{display:block}.q.open button span{transform:rotate(45deg)}</style></head><body><div class="wrap"><nav><a class="brand" href="index.html">♡ <span>US</span>BOOTH</a><a href="index.html">← Back home</a></nav><section class="hero"><div class="eyebrow">FAQ</div><h1>Questions,<br>answered.</h1></section><div id="faq"></div></div><script>const items=[['Does UsBooth work with one phone?','Yes. Choose We\'re together on the home page and the booth runs as a single-device photobooth.'],['Can two people use different phones?','Yes. Choose We\'re apart, create or join a room, then use the two-phone camera connection and ready flow.'],['Do I need to pay?','The core UsBooth experience is designed to stay free. Future sponsorships and partnerships can support the product.'],['What is a temporary memory?','It is a shareable server-side copy designed to expire automatically after 10 minutes. It is separate from the browser\'s local Memory Vault.'],['Where are Memory Vault photos stored?','The current browser-based vault stores saved memories locally on that device. A future account-based cloud vault can provide cross-device storage.'],['Can I work with UsBooth?','Absolutely. Use the Partnerships page for brands, sponsors, events and creative collaborations.']];const root=document.getElementById('faq');items.forEach(([q,a])=>{const e=document.createElement('div');e.className='q';e.innerHTML='<button>'+q+'<span>＋</span></button><div class="answer">'+a+'</div>';e.querySelector('button').onclick=()=>e.classList.toggle('open');root.append(e)});</script></body></html>
