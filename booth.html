<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#09090d">

<title>UsBooth ♡ — One booth. Two places.</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      #54203f,
      #19111b 35%,
      #09090d 75%
    );

  color:#fff;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1200px,100%);
  margin:auto;

  padding:
    20px
    12px
    70px;
}

header{
  text-align:center;
  margin-bottom:24px;
}

.logo{
  font-size:13px;
  font-weight:1000;
  letter-spacing:4px;
}

.logo span{
  color:#ff719f;
}

h1{
  margin:
    15px
    0
    10px;

  font-size:
    clamp(
      42px,
      8vw,
      75px
    );

  line-height:.94;
  letter-spacing:-5px;
}

.accent{
  color:#ff719f;
}

.subtitle{
  color:#aaa7b4;
  font-size:14px;
}

.card{
  background:rgba(20,20,29,.92);

  border:
    1px solid
    #302f3d;

  border-radius:26px;

  padding:15px;

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.5);

  backdrop-filter:blur(20px);
}

/* MODE SELECTOR */
.modeSelector{display:none !important;/* mode selected on home page */
  display:flex;justify-content:center;gap:8px;margin-bottom:12px;padding:5px;border:1px solid #302f3d;border-radius:14px;background:#101018;}
.modeButton{flex:1;max-width:260px;border:0;border-radius:10px;padding:11px 14px;background:transparent;color:#777482;font-size:10px;font-weight:1000;transition:.18s ease;}
.modeButton.active{background:#ff719f;color:#210812;}
.modeButton small{display:block;margin-top:2px;opacity:.65;font-size:8px;font-weight:700;}
.singleHint{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid #292835;border-radius:12px;background:#101018;color:#aaa7b4;text-align:center;font-size:10px;line-height:1.45;}
body.single-mode .roomBar,body.single-mode .roomInfo,body.single-mode .remoteCameraBox,body.single-mode #micButton{display:none !important;}
body.single-mode .singleHint{display:block;}
body.single-mode .cameraGrid{grid-template-columns:minmax(0,760px);justify-content:center;}
body.single-mode .shutterHint::after{content:"In single-phone mode, both of you are captured by this camera.";}
body.single-mode .shutterHint{font-size:0;}
body.single-mode .shutterHint::after{font-size:9px;}

/* ROOM */

.roomBar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.roomInput{
  width:160px;

  padding:
    11px
    13px;

  border:
    1px solid
    #3b3947;

  border-radius:10px;

  background:#09090f;
  color:#fff;

  outline:none;

  text-align:center;
  text-transform:uppercase;

  letter-spacing:4px;

  font-size:12px;
  font-weight:900;
}

.btn{
  border:0;
  border-radius:999px;

  padding:
    11px
    16px;

  background:#ff719f;
  color:#210812;

  font-size:11px;
  font-weight:1000;
}

.btn.secondary{
  background:#252531;
  color:#fff;

  border:
    1px solid
    #3b3948;
}

.btn.danger{
  background:#40202b;
  color:#ffb7c9;

  border:
    1px solid
    #71364d;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.roomInfo{
  display:none;

  margin:
    12px
    0;

  color:#777482;

  text-align:center;

  font-size:9px;
}

.roomCode{
  display:block;

  color:#ff9fbd;

  font-size:24px;

  font-weight:1000;

  letter-spacing:7px;
}

/* STATUS */

.status{
  margin:
    12px
    0;

  padding:11px;

  border:
    1px solid
    #292835;

  border-radius:12px;

  background:#101018;

  color:#aaa7b4;

  text-align:center;

  font-size:11px;
  font-weight:700;
}

.status.ok{
  color:#8ff0ba;
}

.status.warn{
  color:#ffd68a;
}

.status.error{
  color:#ff8da9;
}

/* CAMERAS */

.cameraGrid{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:13px;
}

.cameraBox{
  position:relative;

  overflow:hidden;

  aspect-ratio:4/3;

  border:
    1px solid
    #373541;

  border-radius:20px;

  background:#020204;
}

.cameraBox video{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:#020204;
}

.cameraLabel{
  position:absolute;

  top:10px;
  left:10px;

  z-index:10;

  padding:
    6px
    9px;

  border-radius:999px;

  background:
    rgba(0,0,0,.72);

  font-size:8px;
  font-weight:1000;
  letter-spacing:1px;
}

.live{
  position:absolute;

  top:10px;
  right:10px;

  z-index:10;

  padding:
    6px
    9px;

  border-radius:999px;

  background:#ff719f;

  color:#210812;

  font-size:8px;
  font-weight:1000;
}

.remoteWaiting{
  position:absolute;

  inset:0;

  z-index:5;

  display:grid;

  place-items:center;

  background:#030305;

  color:#777482;

  text-align:center;

  font-size:11px;
}

.remoteWaiting span{
  display:block;

  margin-bottom:8px;

  color:#ff9fbd;

  font-size:40px;
}

.remoteDebug{
  position:absolute;

  bottom:7px;
  left:7px;
  right:7px;

  z-index:15;

  padding:5px;

  border-radius:7px;

  background:
    rgba(0,0,0,.7);

  color:#aaa7b4;

  text-align:center;

  font-size:8px;
}

/* CONTROLS */

.controls{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:7px;

  margin-top:11px;
}

/* SETTINGS */

.settings{
  margin-top:18px;

  padding:14px;

  border:
    1px solid
    #292835;

  border-radius:16px;

  background:#101018;
}

.settingsTitle{
  margin-bottom:10px;

  font-size:12px;
  font-weight:1000;
}

.settingsGrid{
  display:grid;

  grid-template-columns:
    repeat(
      4,
      1fr
    );

  gap:9px;
}

.setting label{
  display:block;

  margin-bottom:5px;

  color:#777482;

  font-size:8px;
  font-weight:900;
}

select,
input[type="text"]{
  width:100%;

  padding:9px;

  border:
    1px solid
    #383643;

  border-radius:9px;

  background:#09090f;

  color:#fff;

  outline:none;

  font-size:10px;
}

input[type="range"]{
  width:100%;

  accent-color:#ff719f;
}

/* SHUTTER */

.shutterArea{
  display:flex;

  flex-direction:column;

  align-items:center;

  gap:7px;

  margin:
    22px
    0
    8px;
}

.shutter{
  width:80px;
  height:80px;

  border-radius:50%;

  border:
    8px
    solid
    #ff719f;

  background:#fff;

  box-shadow:
    0 0 0 5px
    rgba(255,113,159,.13);

  font-size:0;
}

.shutter:disabled{
  opacity:.35;
}

.shutterHint{
  color:#6e6b78;

  font-size:9px;
}

/* GALLERY */

.gallery{
  margin-top:22px;

  padding-top:20px;

  border-top:
    1px solid
    #292835;
}

.galleryHeader{
  display:flex;

  justify-content:space-between;

  align-items:center;

  flex-wrap:wrap;

  gap:10px;

  margin-bottom:12px;
}

.galleryTitle{
  font-size:15px;
  font-weight:1000;
}

.galleryCount{
  color:#777482;
  font-size:9px;
}

.galleryActions{
  display:flex;
  gap:6px;
}

.photoGrid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(
        180px,
        1fr
      )
    );

  gap:10px;
}

.empty{
  grid-column:1/-1;

  padding:35px;

  border:
    1px dashed
    #3b3947;

  border-radius:15px;

  color:#65626e;

  text-align:center;

  font-size:11px;
}

.photo{
  position:relative;

  overflow:hidden;

  border-radius:15px;

  background:#050507;

  border:
    1px solid
    #34323e;
}

.photo img{
  width:100%;

  display:block;

  aspect-ratio:3/4;

  object-fit:cover;
}

.photoNumber{
  position:absolute;

  top:8px;
  left:8px;

  padding:
    5px
    8px;

  border-radius:999px;

  background:
    rgba(0,0,0,.75);

  font-size:8px;
  font-weight:1000;
}

.photoActions{
  position:absolute;

  left:7px;
  right:7px;
  bottom:7px;

  display:flex;
  gap:5px;
}

.photoActions button{
  flex:1;

  border:0;

  padding:7px;

  border-radius:8px;

  background:
    rgba(0,0,0,.8);

  color:#fff;

  font-size:8px;
  font-weight:900;
}

/* COUNTDOWN */

.countdown{
  position:fixed;

  inset:0;

  z-index:1000;

  display:none;

  place-items:center;

  background:
    rgba(0,0,0,.7);

  backdrop-filter:blur(8px);
}

.countNumber{
  font-size:
    clamp(
      120px,
      25vw,
      250px
    );

  font-weight:1000;

  text-shadow:
    0 0 50px
    rgba(255,113,159,.8);
}

/* FLASH */

.flash{
  position:fixed;

  inset:0;

  z-index:999;

  pointer-events:none;

  background:#fff;

  opacity:0;
}

.flash.active{
  animation:
    flashAnimation
    .35s
    ease;
}

@keyframes flashAnimation{

  0%{
    opacity:0;
  }

  30%{
    opacity:.95;
  }

  100%{
    opacity:0;
  }

}

/* ERROR */

.error{
  display:none;

  margin-top:10px;

  padding:11px;

  border-radius:11px;

  background:#351924;

  border:
    1px solid
    #71364d;

  color:#ffc1d0;

  font-size:10px;

  line-height:1.5;

  word-break:break-word;
}

footer{
  margin-top:28px;

  color:#55525e;

  text-align:center;

  font-size:9px;
}

@media(max-width:760px){

  .app{
    padding:
      14px
      8px
      60px;
  }

  .card{
    padding:10px;
  }

  .modeSelector{display:none !important;/* mode selected on home page */
  flex-direction:column;}
  .modeButton{max-width:none;}

  .cameraGrid{
    grid-template-columns:1fr;
  }

  .settingsGrid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .photoGrid{
    grid-template-columns:
      repeat(2,1fr);
  }

}


/* =========================================================
   PHASE A — PRODUCT POLISH
========================================================= */
:root{
  --ub-pink:#ff719f;
  --ub-pink-soft:#ff9fbd;
  --ub-panel:#101018;
  --ub-line:#302f3d;
  --ub-muted:#8e8a99;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,113,159,.08),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(155,110,255,.07),transparent 25%);
  z-index:-1;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:0 auto 18px;
  max-width:1200px;
  padding:0 2px;
}

.brandMini{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:11px;
  font-weight:1000;
  letter-spacing:2.5px;
}
.brandDot{
  width:9px;height:9px;border-radius:50%;
  background:var(--ub-pink);
  box-shadow:0 0 18px rgba(255,113,159,.65);
}

.topActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.topAction{
  border:1px solid #302f3d;
  background:rgba(16,16,24,.72);
  color:#aaa7b4;
  border-radius:999px;
  padding:8px 11px;
  font-size:9px;
  font-weight:900;
}
.topAction:hover{border-color:#555264;color:#fff}

.heroBadge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:4px;
  padding:7px 11px;
  border:1px solid rgba(255,113,159,.2);
  border-radius:999px;
  background:rgba(255,113,159,.06);
  color:#c5c0cc;
  font-size:8px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.heroBadge b{color:var(--ub-pink-soft)}

.studioBar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin:13px 0;
}
.studioPill{
  padding:10px 9px;
  border:1px solid #292835;
  border-radius:13px;
  background:#0d0d14;
  text-align:center;
}
.studioPill strong{display:block;font-size:10px;color:#fff}
.studioPill span{display:block;margin-top:3px;font-size:7px;color:#777482}

.cameraBox::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,transparent 32.9%,rgba(255,255,255,.09) 33%,transparent 33.1%,transparent 66.2%,rgba(255,255,255,.09) 66.3%,transparent 66.4%),
    linear-gradient(0deg,transparent 32.9%,rgba(255,255,255,.09) 33%,transparent 33.1%,transparent 66.2%,rgba(255,255,255,.09) 66.3%,transparent 66.4%);
  opacity:.0;
  transition:.2s ease;
}
.cameraGridOverlay .cameraBox::after{opacity:1}

.cameraTools{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px;
}

.toolBtn{
  border:1px solid #302f3d;
  border-radius:999px;
  padding:8px 11px;
  background:#101018;
  color:#aaa7b4;
  font-size:8px;
  font-weight:900;
}
.toolBtn.active{background:#ff719f;color:#210812;border-color:#ff719f}

.sectionHeading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:12px;
  margin:20px 2px 9px;
}
.sectionHeading h2{margin:0;font-size:14px}
.sectionHeading p{margin:0;color:#66636f;font-size:8px;text-align:right}

.workflow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:18px 0 4px;
}
.workflowStep{
  padding:12px;
  border:1px solid #292835;
  border-radius:14px;
  background:#0d0d14;
}
.workflowStep .num{color:#ff719f;font-size:9px;font-weight:1000}
.workflowStep strong{display:block;margin-top:5px;font-size:10px}
.workflowStep span{display:block;margin-top:3px;color:#6f6b77;font-size:8px;line-height:1.4}

.memoryHint{
  margin-top:12px;
  padding:11px 13px;
  border:1px solid #292835;
  border-radius:13px;
  background:linear-gradient(90deg,rgba(255,113,159,.06),rgba(255,255,255,.02));
  color:#8c8895;
  font-size:8px;
  line-height:1.5;
}
.memoryHint b{color:#d7d2dc}

@media(max-width:760px){
  .topbar{align-items:flex-start}
  .topActions{max-width:55%}
  .studioBar{grid-template-columns:repeat(2,1fr)}
  .workflow{grid-template-columns:1fr}
}


/* PHASE B REVIEW */
.captureProgress{display:none;margin:12px 0;padding:10px 12px;border:1px solid #292835;border-radius:12px;background:#101018}.captureProgress.visible{display:block}.captureProgressTop{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#aaa7b4}.captureProgressBar{height:5px;margin-top:7px;border-radius:99px;background:#252431;overflow:hidden}.captureProgressFill{height:100%;width:0;background:#ff719f;border-radius:99px;transition:width .25s ease}.reviewOverlay{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,3,7,.82);backdrop-filter:blur(18px)}.reviewOverlay.open{display:flex}.reviewPanel{width:min(960px,100%);max-height:94vh;overflow:auto;padding:16px;border:1px solid #3a3847;border-radius:24px;background:#111119;box-shadow:0 30px 120px rgba(0,0,0,.7)}.reviewHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.reviewTitle{font-size:18px;font-weight:1000}.reviewSub{margin-top:3px;color:#777482;font-size:9px}.reviewClose{border:1px solid #3b3948;border-radius:999px;background:#252531;color:#fff;padding:8px 12px}.reviewCanvasWrap{display:grid;place-items:center;min-height:260px;padding:10px;border-radius:18px;background:#07070b}.reviewCanvasWrap img{display:block;max-width:100%;max-height:62vh;object-fit:contain;border-radius:10px}.reviewActions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}.reviewShots{display:flex;gap:7px;overflow:auto;margin-top:10px}.reviewShot{width:74px;height:74px;flex:0 0 auto;object-fit:cover;border-radius:9px;border:2px solid transparent;cursor:pointer}.reviewShot.active{border-color:#ff719f}.sessionBadge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#241621;color:#ffb1c8;font-size:8px;font-weight:1000}

/* =========================================================
   PHASE C — EDITOR STUDIO
========================================================= */
.editorOverlay{position:fixed;inset:0;z-index:2600;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(2,2,7,.88);backdrop-filter:blur(20px)}
.editorOverlay.open{display:flex}
.editorPanel{width:min(1180px,100%);height:min(94vh,900px);overflow:hidden;display:flex;flex-direction:column;border:1px solid #3b3949;border-radius:24px;background:#101018;box-shadow:0 30px 140px rgba(0,0,0,.75)}
.editorHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid #292835}
.editorTitle{font-size:15px;font-weight:1000}.editorSub{color:#777482;font-size:9px;margin-top:3px}
.editorClose{border:1px solid #3b3948;border-radius:999px;background:#252531;color:#fff;padding:8px 12px}
.editorBody{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0;flex:1}
.editorCanvasArea{min-width:0;display:grid;place-items:center;padding:20px;background:#07070b;position:relative;overflow:auto}
#editorCanvas{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 15px 55px rgba(0,0,0,.55)}
.editorSide{overflow:auto;padding:14px;border-left:1px solid #292835;background:#111119}
.editorSection{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid #292835}.editorSection:last-child{border-bottom:0}
.editorSectionTitle{font-size:9px;font-weight:1000;letter-spacing:1px;color:#aaa7b4;margin-bottom:9px}
.editorButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.editorButtons.two{grid-template-columns:repeat(2,1fr)}
.editorBtn{border:1px solid #383643;border-radius:9px;padding:9px 7px;background:#191923;color:#fff;font-size:9px;font-weight:900}.editorBtn.active{border-color:#ff719f;background:#2b1722;color:#ffb7cb}
.editorRange{display:grid;grid-template-columns:75px 1fr 38px;align-items:center;gap:8px;margin:8px 0}.editorRange label{font-size:8px;color:#777482;font-weight:900}.editorRange output{font-size:8px;color:#aaa7b4;text-align:right}
.editorInput{width:100%;padding:9px;border:1px solid #383643;border-radius:9px;background:#09090f;color:#fff;outline:none;font-size:10px}
.editorSelect{width:100%;padding:9px;border:1px solid #383643;border-radius:9px;background:#09090f;color:#fff;outline:none;font-size:10px}
.editorFooter{display:flex;justify-content:flex-end;gap:7px;padding:12px 16px;border-top:1px solid #292835}
.editorPrimary{border:0;border-radius:999px;padding:10px 17px;background:#ff719f;color:#210812;font-size:10px;font-weight:1000}.editorSecondary{border:1px solid #3b3948;border-radius:999px;padding:10px 15px;background:#252531;color:#fff;font-size:10px;font-weight:900}
.editorStickerGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.stickerBtn{border:1px solid #383643;border-radius:8px;background:#191923;padding:8px 2px;font-size:17px}.stickerBtn.active{border-color:#ff719f;background:#2b1722}
.editorPosition{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}.posBtn{border:1px solid #383643;background:#191923;color:#aaa7b4;border-radius:7px;padding:6px;font-size:9px}.posBtn.active{border-color:#ff719f;color:#ff9fbd}
.editorHint{color:#686572;font-size:8px;line-height:1.45;margin-top:7px}
