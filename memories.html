<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UsBooth ♡ — Memories</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui;background:radial-gradient(circle at 10% 0,#4a1f35,transparent 30%),radial-gradient(circle at 90% 20%,#291c4c,transparent 28%),#0a070d}.wrap{width:min(1100px,calc(100% - 30px));margin:auto;padding:28px 0 70px}nav{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;letter-spacing:3px}.brand span{color:#ff719f}nav a{color:#aaa0aa;text-decoration:none;font-size:10px}.hero{padding:75px 0 35px}.eyebrow{font-size:9px;letter-spacing:3px;color:#ff9fbb;font-weight:1000}h1{font-size:clamp(42px,7vw,72px);letter-spacing:-4px;margin:10px 0}.sub{color:#918691;font-size:11px;line-height:1.7}.tools{display:flex;gap:8px;margin:25px 0}.tools input,.tools select{background:#151019;color:#ddd;border:1px solid #342733;border-radius:10px;padding:10px;font-size:9px;flex:1}.tools button{background:#ff719f;border:0;border-radius:10px;padding:10px 13px;font-size:9px;font-weight:1000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:#746b75;border:1px dashed #332633;border-radius:20px}.card{overflow:hidden;border:1px solid #302430;border-radius:16px;background:#120d15}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.meta{padding:10px}.meta b{display:block;font-size:9px}.meta small{color:#706671;font-size:7px}.actions{display:flex;gap:5px;padding:0 10px 10px}.actions button{flex:1;background:#171119;color:#b9aeb9;border:1px solid #302430;border-radius:8px;padding:7px;font-size:8px}.actions .fav.active{color:#ff719f;border-color:#ff719f}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.tools{flex-direction:column}}</style></head><body><div class="wrap"><nav><a class="brand" href="index.html">♡ <span>US</span>BOOTH</a><a href="index.html">← Back home</a></nav><section class="hero"><div class="eyebrow">YOUR COLLECTION</div><h1>Memories ♡</h1><p class="sub">Photos saved by UsBooth on this browser. Your local Memory Vault works without an account.</p></section><div class="tools"><input id="search" placeholder="Search memories…"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="fav">Favorites first</option></select><button id="clear">Clear all</button></div><div id="grid" class="grid"></div></div><script>const K='usbooth.memories.v1';let a=[];try{a=JSON.parse(localStorage.getItem(K)||'[]')}catch{}const g=document.getElementById('grid'),q=document.getElementById('search'),s=document.getElementById('sort');function save(){localStorage.setItem(K,JSON.stringify(a))}function dl(u,n){const x=document.createElement('a');x.href=u;x.download=n;x.click()}function render(){let z=q.value.toLowerCase().trim(),r=a.filter(m=>(m.title+' '+m.footer).toLowerCase().includes(z));r.sort((x,y)=>s.value==='old'?x.created-y.created:s.value==='fav'?Number(y.favorite)-Number(x.favorite)||y.created-x.created:y.created-x.created);g.innerHTML='';if(!r.length){g.innerHTML='<div class="empty">No memories found yet. Create your first one ♡</div>';return}r.forEach(m=>{let c=document.createElement('article');c.className='card';let i=document.createElement('img');i.src=m.dataUrl;let meta=document.createElement('div');meta.className='meta';meta.innerHTML='<b></b><small></small>';meta.children[0].textContent=m.title||'Untitled memory';meta.children[1].textContent=new Date(m.created).toLocaleString();let ac=document.createElement('div');ac.className='actions';let f=document.createElement('button');f.className='fav'+(m.favorite?' active':'');f.textContent=m.favorite?'♥':'♡';f.onclick=()=>{m.favorite=!m.favorite;save();render()};let d=document.createElement('button');d.textContent='↓ Download';d.onclick=()=>dl(m.dataUrl,(m.title||'usbooth-memory').replace(/[^\w-]+/g,'-')+'.png');let del=document.createElement('button');del.textContent='× Delete';del.onclick=()=>{a=a.filter(x=>x.id!==m.id);save();render()};ac.append(f,d,del);c.append(i,meta,ac);g.append(c)})}q.oninput=render;s.onchange=render;document.getElementById('clear').onclick=()=>{if(confirm('Delete all local UsBooth memories?')){a=[];save();render()}};render();</script></body></html>
