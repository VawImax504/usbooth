<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UsBooth ♡ — Memories</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui;background:radial-gradient(circle at 10% 0,#4a1f35,transparent 30%),radial-gradient(circle at 90% 20%,#291c4c,transparent 28%),#0a070d}.wrap{width:min(1100px,calc(100% - 30px));margin:auto;padding:28px 0 70px}nav{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;letter-spacing:3px}.brand span{color:#ff719f}nav a{color:#aaa0aa;text-decoration:none;font-size:10px}.hero{padding:75px 0 35px}.eyebrow{font-size:9px;letter-spacing:3px;color:#ff9fbb;font-weight:1000}h1{font-size:clamp(42px,7vw,72px);letter-spacing:-4px;margin:10px 0}.sub{color:#918691;font-size:11px;line-height:1.7}.tools{display:flex;gap:8px;margin:25px 0}.tools input,.tools select{background:#151019;color:#ddd;border:1px solid #342733;border-radius:10px;padding:10px;font-size:9px;flex:1}.tools button{background:#ff719f;border:0;border-radius:10px;padding:10px 13px;font-size:9px;font-weight:1000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:#746b75;border:1px dashed #332633;border-radius:20px}.card{overflow:hidden;border:1px solid #302430;border-radius:16px;background:#120d15}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.meta{padding:10px}.meta b{display:block;font-size:9px}.meta small{color:#706671;font-size:7px}.actions{display:flex;gap:5px;padding:0 10px 10px}.actions button{flex:1;background:#171119;color:#b9aeb9;border:1px solid #302430;border-radius:8px;padding:7px;font-size:8px}.actions .fav.active{color:#ff719f;border-color:#ff719f}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.tools{flex-direction:column}}</style></head><body><div class="wrap"><nav><a class="brand" href="index.html">♡ <span>US</span>BOOTH</a><a href="index.html">← Back home</a></nav><section class="hero"><div class="eyebrow">YOUR COLLECTION</div><h1>Memories ♡</h1><p class="sub">Photos saved by UsBooth on this browser. Your local Memory Vault works without an account.</p></section><div class="tools"><input id="search" placeholder="Search memories…"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="fav">Favorites first</option></select><button id="clear">Clear all</button></div><div id="grid" class="grid"></div></div><script>
const DB_NAME="UsBoothVault",DB_VERSION=1,STORE="memories";
let memories=[];
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE)){const s=db.createObjectStore(STORE,{keyPath:"id"});s.createIndex("created","created");s.createIndex("favorite","favorite")}};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(){return openDB().then(db=>new Promise((resolve,reject)=>{const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)}))}
function put(m){return openDB().then(db=>new Promise((resolve,reject)=>{const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(m);t.oncomplete=resolve;t.onerror=()=>reject(t.error)}))}
function del(id){return openDB().then(db=>new Promise((resolve,reject)=>{const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)}))}
function clearDB(){return openDB().then(db=>new Promise((resolve,reject)=>{const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).clear();t.oncomplete=resolve;t.onerror=()=>reject(t.error)}))}
function blobUrl(blob){return URL.createObjectURL(blob)}
function download(url,name){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function migrateLegacy(){try{if(localStorage.getItem("usbooth.vaultMigrated.v2"))return;const old=JSON.parse(localStorage.getItem("usbooth.memories.v1")||"[]");for(const m of old){if(m?.dataUrl){const [h,d]=m.dataUrl.split(",");const bin=atob(d);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await put({...m,blob:new Blob([u],{type:(h.match(/data:([^;]+)/)||[])[1]||"image/jpeg"}),dataUrl:undefined})}}localStorage.setItem("usbooth.vaultMigrated.v2","1")}catch(e){console.warn(e)}}
async function render(){memories=await all();let q=search.value.toLowerCase().trim();let arr=memories.filter(m=>(m.title||"").toLowerCase().includes(q)||(m.footer||"").toLowerCase().includes(q));if(sort.value==="old")arr.sort((a,b)=>a.created-b.created);else if(sort.value==="fav")arr.sort((a,b)=>Number(b.favorite)-Number(a.favorite)||b.created-a.created);else arr.sort((a,b)=>b.created-a.created);grid.innerHTML="";if(!arr.length){grid.innerHTML='<div class="empty">No memories found yet. Create your first one ♡</div>';return}for(const m of arr){const c=document.createElement("article");c.className="card";const img=document.createElement("img");img.src=m.blob?blobUrl(m.blob):m.dataUrl;const meta=document.createElement("div");meta.className="meta";meta.innerHTML="<b></b><small></small>";meta.children[0].textContent=m.title||"Untitled memory";meta.children[1].textContent=new Date(m.created).toLocaleString();const ac=document.createElement("div");ac.className="actions";const fav=document.createElement("button");fav.className="fav"+(m.favorite?" active":"");fav.textContent=m.favorite?"♥":"♡";fav.onclick=async()=>{m.favorite=!m.favorite;await put(m);render()};const d=document.createElement("button");d.textContent="↓ Download";d.onclick=()=>download(img.src,(m.title||"usbooth-memory").replace(/[^\w-]+/g,"-")+".jpg");const x=document.createElement("button");x.textContent="× Delete";x.onclick=async()=>{await del(m.id);render()};ac.append(fav,d,x);c.append(img,meta,ac);grid.append(c)}}
const grid=document.getElementById("grid"),search=document.getElementById("search"),sort=document.getElementById("sort");search.oninput=render;sort.onchange=render;document.getElementById("clear").onclick=async()=>{if(confirm("Delete all local UsBooth memories?")){await clearDB();render()}};(async()=>{await migrateLegacy();await render()})().catch(e=>{console.error(e);grid.innerHTML='<div class="empty">Your browser could not open the Memory Vault. Try a current Chrome, Edge or Safari build.</div>'});
</script></body></html>
